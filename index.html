<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Frontier's End</title>
  <meta name="description" content="Frontier's End — 1890'lar Amerika'sında geçen 2D açık dünya hayatta kalma ve rol yapma oyunu.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="fx-vignette"></div>
    <div id="fx-hurt"></div>
    <div id="fx-deadeye"></div>

    <!-- ================= HUD ================= -->
    <div id="hud" class="hidden">
      <div id="hud-help" class="hidden"></div>
      <div id="feed"></div>

      <div id="hud-tr">
        <div id="hud-top">
          <div id="hud-txt"><div id="hud-money">$0.00</div><div id="hud-time">08:00</div></div>
          <div id="hud-env"><i class="dl-orb"></i><b class="dl-t"></b></div>
        </div>
        <div id="hud-sub"><span id="hud-date"></span><span id="hud-age"></span></div>
        <div id="hud-wanted" class="hidden">
          <div class="wanted-title" data-i18n="ARANIYOR">ARANIYOR</div>
          <div class="wanted-stars"></div>
          <div class="wanted-bounty"></div>
          <div class="wanted-truce hidden"></div>
        </div>
        <div id="hud-bounty" class="hidden"></div>
        <div id="hud-witness" class="hidden"><div class="wt-t"></div><div class="wt-bar"><i></i></div></div>
        <div id="hud-danger" class="hidden"></div>
        <div id="honor-flash"></div>
        <div id="hud-quest" class="hidden"></div>
      </div>

      <!-- Sol alt: pirinç kadranlı radar; yayında madalyonlar (sağ üstte oyuncu, sağ altta ihtiyaçlar, solda at), altta durum rozetleri -->
      <div id="hud-bl">
        <div id="radar-wrap">
          <canvas id="radar" width="448" height="448"></canvas>
        </div>
        <div id="cores">
          <div class="core arc" id="core-hp"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="heart"></span></div>
          <div class="core arc" id="core-sta"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="bolt"></span></div>
          <div class="core arc" id="core-de"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="deadeye"></span></div>
        </div>
        <div id="horse-cores" class="hidden">
          <div class="core small arc" id="core-hhp"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="horse"></span></div>
          <div class="core small arc" id="core-hsta"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="bolt"></span></div>
        </div>
        <div id="status-icons"></div>
        <div id="needs">
          <div class="need arc" id="need-hunger" data-i18n-title="Açlık"><span data-g="meat"></span></div>
          <div class="need arc" id="need-thirst" data-i18n-title="Susuzluk"><span data-g="drop"></span></div>
          <div class="need arc" id="need-energy" data-i18n-title="Uyku"><span data-g="moon"></span></div>
          <div class="need arc" id="need-clean" data-i18n-title="Temizlik"><span data-g="soap"></span></div>
        </div>
        <div id="hud-xinfo"></div>
      </div>

      <div id="hud-br">
        <div id="weapon-hud"><span id="w-icon"></span><span id="w-info"><span id="w-name"></span><span id="w-pips"></span><span id="w-key"></span></span><span id="w-ammo"></span></div>
        <div id="prompts"></div>
      </div>

      <div id="subtitle" class="hidden"></div>
      <div id="coach"></div>
      <div id="loc-title" class="hidden"><div class="lt-name"></div><div class="lt-sub"></div></div>
      <div id="toasts"></div>
      <div id="fps" class="hidden"></div>
    </div>

    <!-- Silah çarkı -->
    <div id="wheel" class="hidden"><div id="wheel-ring"></div><div id="wheel-hint"></div></div>

    <!-- Modal katmanı -->
    <div id="modals"></div>

    <!-- Harita -->
    <div id="mapscreen" class="hidden">
      <canvas id="mapcanvas"></canvas>
      <div id="map-frame"></div>
      <div id="map-legend"></div>
      <div id="map-pins"></div>
      <div id="map-info"></div>
      <div id="map-me"></div>
      <div id="map-hint"></div>
      <div id="map-cursor"></div>
    </div>

    <!-- Ana menü: kamp ateşi videosu (döngü; yoksa çizilen piksel gün batımı), film greni, süslü başlık, odak işaretli menü, son hayat kartı -->
    <div id="mainmenu" class="screen hidden">
      <canvas id="menubg"></canvas>
      <video id="menuvid" muted loop playsinline preload="auto" aria-hidden="true"></video>
      <div class="mm-shade"></div>
      <div class="mm-grain"></div>
      <div class="mm-inner">
        <div class="mm-title">
          <div class="mm-pre" data-i18n="— Amerika, 1890 —">— Amerika, 1890 —</div>
          <h1>FRONTIER'S END</h1>
          <div class="mm-rule"></div>
          <div class="mm-sub" data-i18n="Bir Batılının Hayatı">Bir Batılının Hayatı</div>
        </div>
        <div class="mm-items" id="mm-items"></div>
        <div class="mm-foot" id="mm-foot"></div>
      </div>
      <div class="mm-card hidden" id="mm-card"></div>
      <!-- Wiki düğmesi: oyunun çevrimiçi rehberini (frontiersend) tarayıcıda açar -->
      <div class="mm-wiki nav" id="mm-wiki" role="button" tabindex="-1">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="mmwB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d690"/><stop offset=".55" stop-color="#c9973f"/><stop offset="1" stop-color="#875c20"/></linearGradient>
            <linearGradient id="mmwP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6e3"/><stop offset="1" stop-color="#e8d4a6"/></linearGradient>
          </defs>
          <circle cx="32" cy="30" r="28" fill="url(#mmwB)"/>
          <circle cx="32" cy="30" r="24.8" fill="#2b1d13"/>
          <circle cx="32" cy="30" r="22.8" fill="none" stroke="#c9973f" stroke-width=".8" stroke-dasharray="1.5 2.3" opacity=".75"/>
          <path d="M32 9.2 L33.3 12.7 L37 12.8 L34.1 15.1 L35.1 18.6 L32 16.5 L28.9 18.6 L29.9 15.1 L27 12.8 L30.7 12.7 Z" fill="url(#mmwB)"/>
          <path d="M31 22.6c-4.4-2.4-9.8-2.8-14.8-1.1v17.8c5-1.7 10.4-1.3 14.8 1.1z" fill="url(#mmwP)"/>
          <path d="M33 22.6c4.4-2.4 9.8-2.8 14.8-1.1v17.8c-5-1.7-10.4-1.3-14.8 1.1z" fill="url(#mmwP)"/>
          <path d="M32 23.2v17.8" stroke="#875c20" stroke-width="1.3"/>
          <g fill="none" stroke="#b08a52" stroke-width=".95" stroke-linecap="round" opacity=".85">
            <path d="M19.4 26.2c3.1-.8 6.2-.6 8.7.5M19.4 29.9c3.1-.8 6.2-.6 8.7.5M19.4 33.6c3.1-.8 6.2-.6 8.7.5"/>
            <path d="M35.9 26.7c2.5-1.1 5.6-1.3 8.7-.5M35.9 30.4c2.5-1.1 5.6-1.3 8.7-.5M35.9 34.1c2.5-1.1 5.6-1.3 8.7-.5"/>
          </g>
          <path d="M3 45h58l-4.6 5.6L61 56.2H3l4.6-5.6z" fill="#8e2418" stroke="#4e110a" stroke-width=".9"/>
          <path d="M7.6 45.4v10.4M56.4 45.4v10.4" stroke="#5e170e" stroke-width=".7" opacity=".7"/>
          <text x="32" y="53.9" text-anchor="middle" font-family="Rye, 'IM Fell English SC', Georgia, serif" font-size="8.8" letter-spacing="1.8" fill="#f6e2b0">WIKI</text>
        </svg>
        <span class="mm-wiki-tip"></span>
      </div>
    </div>

    <!-- Yükleniyor: ray üstünde ilerleyen atlı -->
    <div id="loading" class="screen hidden">
      <div class="mm-grain"></div>
      <div class="ld-inner">
        <div class="ld-title">FRONTIER'S END</div>
        <div class="mm-rule"></div>
        <div class="ld-track"><div class="ld-bar"><i id="ld-fill"></i></div><span class="ld-rider" id="ld-rider"></span></div>
        <div class="ld-msg" id="ld-msg">...</div>
        <div class="ld-tipbox"><div class="ld-tk" data-i18n="İpucu">İpucu</div><div class="ld-tip" id="ld-tip"></div></div>
      </div>
    </div>

    <div id="fader"><div id="fader-text"></div></div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/portrait.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/carry.js"></script>
  <script src="js/townlife.js"></script>
  <script src="js/city.js"></script>
  <script src="js/npcmind.js"></script>
  <script src="js/npcsense.js"></script>
  <script src="js/npccombat.js"></script>
  <script src="js/npcmorale.js"></script>
  <script src="js/npccamp.js"></script>
  <script src="js/npcacts.js"></script>
  <script src="js/business.js"></script>
  <script src="js/tycoon.js"></script>
  <script src="js/influence.js"></script>
  <script src="js/guards.js"></script>
  <script src="js/haulers.js"></script>
  <script src="js/develop.js"></script>
  <script src="js/devworld.js"></script>
  <script src="js/hunters.js"></script>
  <script src="js/rails.js"></script>
  <script src="js/brawl.js"></script>
  <script src="js/binoculars.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/handbook.js"></script>
  <script src="js/legends.js"></script>
  <script src="js/poker.js"></script>
  <script src="js/homestead.js"></script>
  <script src="js/hotel.js"></script>
  <script src="js/estate.js"></script>
  <script src="js/billiards.js"></script>
  <script src="js/cinema.js"></script>
  <script src="js/storycine.js"></script>
  <script src="js/opencine.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/juice.js"></script>
  <script src="js/hybrid.js"></script>
  <script src="js/worldsave.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/story_outlaw.js"></script>
  <script src="js/story_immigrant.js"></script>
  <script src="js/story_rail.js"></script>
  <script src="js/story_trapper.js"></script>
  <script src="js/game.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
