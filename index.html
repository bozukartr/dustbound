<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Frontier's End</title>
  <meta name="description" content="Frontier's End — 1890'lar Amerika'sında geçen 2D açık dünya hayatta kalma ve rol yapma oyunu.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="fx-vignette"></div>
    <div id="fx-hurt"></div>
    <div id="fx-deadeye"></div>

    <!-- ================= HUD ================= -->
    <div id="hud" class="hidden">
      <div id="hud-help" class="hidden"></div>
      <div id="feed"></div>

      <div id="hud-tr">
        <div id="hud-money">$0.00</div>
        <div id="hud-clock"><span id="hud-time">08:00</span><span id="hud-date"></span></div>
        <div id="hud-age"></div>
        <div id="hud-wanted" class="hidden">
          <div class="wanted-title" data-i18n="ARANIYOR">ARANIYOR</div>
          <div class="wanted-stars"></div>
          <div class="wanted-bounty"></div>
        </div>
        <div id="hud-bounty" class="hidden"></div>
        <div id="hud-witness" class="hidden"><div class="wt-t"></div><div class="wt-bar"><i></i></div></div>
        <div id="honor-flash"></div>
      </div>

      <div id="hud-bl">
        <div id="cores">
          <div class="core" id="core-hp"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="heart"></span></div>
          <div class="core" id="core-sta"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="bolt"></span></div>
          <div class="core" id="core-de"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="deadeye"></span></div>
        </div>
        <div id="needs">
          <div class="need" id="need-hunger" data-i18n-title="Açlık"><span data-g="meat"></span><i></i></div>
          <div class="need" id="need-thirst" data-i18n-title="Susuzluk"><span data-g="drop"></span><i></i></div>
          <div class="need" id="need-energy" data-i18n-title="Uyku"><span data-g="moon"></span><i></i></div>
          <div class="need" id="need-clean" data-i18n-title="Temizlik"><span data-g="soap"></span><i></i></div>
        </div>
        <div id="radar-wrap">
          <canvas id="radar" width="200" height="200"></canvas>
          <div id="radar-n" data-i18n="@pusula|K">K</div>
          <div id="temp-gauge"><div id="temp-fill"></div><span id="temp-val">20°</span></div>
        </div>
        <div id="horse-cores" class="hidden">
          <div class="core small" id="core-hhp"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="horse"></span></div>
          <div class="core small" id="core-hsta"><div class="ring"></div><div class="fill"></div><span class="cic" data-g="bolt"></span></div>
        </div>
        <div id="status-icons"></div>
      </div>

      <div id="hud-br">
        <div id="weapon-hud"><span id="w-icon"></span><span id="w-name"></span><span id="w-ammo"></span></div>
        <div id="prompts"></div>
      </div>

      <div id="subtitle" class="hidden"></div>
      <div id="loc-title" class="hidden"><div class="lt-name"></div><div class="lt-sub"></div></div>
      <div id="toasts"></div>
      <div id="fps" class="hidden"></div>
    </div>

    <!-- Silah çarkı -->
    <div id="wheel" class="hidden"><div id="wheel-ring"></div><div id="wheel-hint"></div></div>

    <!-- Modal katmanı -->
    <div id="modals"></div>

    <!-- Harita -->
    <div id="mapscreen" class="hidden">
      <canvas id="mapcanvas"></canvas>
      <div id="map-legend"></div>
      <div id="map-info"></div>
      <div id="map-hint"></div>
      <div id="map-cursor"></div>
    </div>

    <!-- Ana menü -->
    <div id="mainmenu" class="screen hidden">
      <canvas id="menubg"></canvas>
      <div class="mm-inner">
        <div class="mm-title">
          <div class="mm-pre" data-i18n="— Amerika, 1890 —">— Amerika, 1890 —</div>
          <h1>FRONTIER'S END</h1>
          <div class="mm-sub" data-i18n="Bir Batılının Hayatı">Bir Batılının Hayatı</div>
        </div>
        <div class="mm-items" id="mm-items"></div>
        <div class="mm-foot" id="mm-foot"></div>
      </div>
    </div>

    <!-- Yükleniyor -->
    <div id="loading" class="screen hidden">
      <div class="ld-inner">
        <div class="ld-title">FRONTIER'S END</div>
        <div class="ld-bar"><i id="ld-fill"></i></div>
        <div class="ld-msg" id="ld-msg">...</div>
        <div class="ld-tip" id="ld-tip"></div>
      </div>
    </div>

    <div id="fader"><div id="fader-text"></div></div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/portrait.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/carry.js"></script>
  <script src="js/townlife.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cinema.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
